# Optional Oracle XE for local assessment labs.
# Requires Docker with enough RAM (~2GB+) allocated.
#
# Usage:
#   docker compose -f docker-compose.oracle.yml up -d
#   # wait until healthy, then connect and run DDL + seed
#
# Default XE credentials (container image):
#   system / OraclePassword123 (set below)
# Create app user after first boot, then run:
#   database/ddl/01_schema.sql
#   database/seed/02_seed.sql

services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: hms-oracle-xe
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: OraclePassword123
      APP_USER: hms_app
      APP_USER_PASSWORD: hms_app_pwd
    volumes:
      - hms-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  hms-oracle-data:
